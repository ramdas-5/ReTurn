# Render Blueprint — Flask API (Docker) for ReTurn.
#
# The frontend is deployed separately on Vercel (Root Directory: frontend).
# The PostgreSQL database is expected to be a Neon (or other managed) instance;
# paste its connection string into DATABASE_URL when Render prompts for it.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: return-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # postgresql://user:password@host/db?sslmode=require  (Neon direct URL)
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Browser calls are same-origin through the Vercel rewrite, so CORS is only
      # needed if you ever call the API directly. Set this to the Vercel URL.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ROUTING_PROVIDER
        value: auto
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: ROUTING_TIMEOUT_SECONDS
        value: "2"
      # Optional: create the first administrator on boot (idempotent). Use this
      # instead of demo seeding for a real deployment; leave the email blank to skip.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: ReTurn Administrator
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Seeds the fictional demo accounts once (skipped when users already exist).
      # Set to "false" before handing the deployment to real users.
      - key: SEED_DEMO_DATA
        value: "true"
      # Keep "false"; "true" wipes and re-seeds on every container start.
      - key: SEED_DEMO_DATA_RESET
        value: "false"
      # 512 MB free instance: one worker with threads is the safest default.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
